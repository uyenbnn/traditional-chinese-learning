title: 第二課：日常生活
level: Beginner
vocabulary:
  - traditional: 早餐
    hanzi: 早餐
    wordType: noun
    pinyin: zao can
    meaning: Breakfast
    example: 我每天吃早餐。
  - traditional: 上班
    hanzi: 上班
    wordType: verb
    pinyin: shang ban
    meaning: Go to work
    example: 他八點上班。
  - traditional: 回家
    hanzi: 回家
    wordType: verb
    pinyin: hui jia
    meaning: Go home
    example: 我晚上六點回家。
