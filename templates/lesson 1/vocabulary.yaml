title: 第一課：打招呼
level: Beginner
vocabulary:
  - traditional: 你好
    hanzi: nhĩ hảo
    wordType: phrase
    pinyin: nǐ hǎo
    meaning: Hello
    example: 你好！很高興見到你。
  - traditional: 謝謝
    hanzi: 謝謝
    wordType: phrase
    pinyin: xiè xiè
    meaning: Thank you
    example: 謝謝你的幫助。
  - traditional: 再見
    hanzi: 再見
    wordType: phrase
    pinyin: zài jiàn
    meaning: Goodbye
    example: 明天見，再見！
